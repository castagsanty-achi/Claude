<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500;700&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1E3A2A;--amarillo:#F2B705;--crema:#F3EEE2;--tierra:#6B4A2B}
body{margin:0;background:#d9d4c7;font-family:Archivo,sans-serif}
.card{width:800px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-sizing:border-box}
.tag{position:absolute;left:28px;top:22px;font:700 15px Archivo;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.crema{background:var(--crema);color:var(--verde)}
.verde{background:var(--verde);color:var(--crema)}
.word{font-family:'Archivo Black';font-size:92px;letter-spacing:.02em;line-height:1}
.agro{font:700 30px Oswald;letter-spacing:.5em;margin-left:.5em}
.sub{font:500 20px Oswald;letter-spacing:.32em;text-transform:uppercase;margin-top:14px}
.row{display:flex;align-items:center;gap:34px}
</style></head><body>

<!-- 1: la M de alambre -->
<div class="card crema" id="c1"><div class="tag">1 · La M de alambre</div>
<svg width="300" height="190" viewBox="0 0 300 190">
  <g stroke="#6B4A2B" stroke-width="14" stroke-linecap="round"><line x1="30" y1="40" x2="30" y2="180"/><line x1="150" y1="70" x2="150" y2="180"/><line x1="270" y1="40" x2="270" y2="180"/></g>
  <path d="M30 40 L150 150 L270 40" fill="none" stroke="#1E3A2A" stroke-width="10" stroke-linejoin="round"/>
  <g fill="#F2B705" stroke="#1E3A2A" stroke-width="4"><circle cx="30" cy="40" r="15"/><circle cx="270" cy="40" r="15"/><circle cx="150" cy="150" r="13"/></g>
</svg>
<div class="agro" style="margin-top:18px">AGRO</div><div class="word">MARTINO</div><div class="sub">Alambrado eléctrico</div></div>

<!-- 2: el potrero -->
<div class="card verde" id="c2"><div class="tag">2 · El potrero</div>
<div class="row">
<svg width="230" height="200" viewBox="0 0 230 200">
  <g stroke="#F3EEE2" stroke-width="12" stroke-linecap="round"><line x1="25" y1="30" x2="25" y2="185"/><line x1="115" y1="30" x2="115" y2="185"/><line x1="205" y1="30" x2="205" y2="185"/></g>
  <g fill="none" stroke="#F3EEE2" stroke-width="5"><path d="M25 70 Q70 82 115 70 Q160 82 205 70"/><path d="M25 120 Q70 132 115 120 Q160 132 205 120"/></g>
  <path d="M128 52 L100 102 L120 102 L104 150 L146 88 L124 88 L140 52 Z" fill="#F2B705" stroke="#1E3A2A" stroke-width="5" stroke-linejoin="round"/>
</svg>
<div><div class="agro" style="margin-left:.1em;text-align:left">AGRO</div><div class="word" style="font-size:80px">MARTINO</div><div class="sub" style="color:#F2B705">Mar del Plata · Argentina</div></div>
</div></div>

<!-- 3: sello campero -->
<div class="card crema" id="c3"><div class="tag">3 · Sello campero</div>
<svg width="420" height="420" viewBox="0 0 420 420">
  <defs><path id="arc" d="M210 210 m-160 0 a160 160 0 1 1 320 0 a160 160 0 1 1 -320 0"/></defs>
  <circle cx="210" cy="210" r="200" fill="#1E3A2A"/><circle cx="210" cy="210" r="186" fill="none" stroke="#F2B705" stroke-width="4"/>
  <circle cx="210" cy="210" r="128" fill="#F3EEE2"/>
  <text font-family="Oswald" font-weight="700" font-size="34" letter-spacing="6" fill="#F3EEE2"><textPath href="#arc" startOffset="0">AGRO MARTINO ★ ALAMBRADO ELÉCTRICO ★</textPath></text>
  <g stroke="#6B4A2B" stroke-width="10" stroke-linecap="round"><line x1="150" y1="160" x2="150" y2="275"/><line x1="270" y1="160" x2="270" y2="275"/></g>
  <g fill="none" stroke="#1E3A2A" stroke-width="5"><path d="M150 190 Q210 204 270 190"/><path d="M150 235 Q210 249 270 235"/></g>
  <path d="M220 150 L194 205 L214 205 L198 260 L238 194 L218 194 L232 150 Z" fill="#F2B705" stroke="#1E3A2A" stroke-width="5" stroke-linejoin="round"/>
  <text x="210" y="312" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="22" letter-spacing="4" fill="#1E3A2A">EST. 2026</text>
</svg></div>

<!-- 4: rayo simple -->
<div class="card" id="c4" style="background:#F2B705;color:#1E3A2A"><div class="tag">4 · Rayo directo</div>
<div class="row">
<svg width="150" height="150" viewBox="0 0 150 150"><rect width="150" height="150" rx="26" fill="#1E3A2A"/>
<path d="M86 18 L40 82 L70 82 L56 132 L110 62 L80 62 L96 18 Z" fill="#F2B705"/></svg>
<div><div class="word" style="font-size:100px">MARTINO</div><div class="agro" style="margin-left:.15em;letter-spacing:.62em">AGRO · CERCOS</div></div>
</div></div>
</body></html>
